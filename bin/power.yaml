        - [1024, 64, 3.93e-1, 5.27e-11, 0, 5.04e-11 ]     # extrapolated
        - [1024, 128,7.47e-1, 1.01e-10, 0, 9.57e-11 ]     # extrapolated

        - [2048, 16, 1.66e-1, 2.06e-11, 0, 2.20e-11 ]     # extrapolated
        - [2048, 32, 1.83e-1, 3.95e-11, 0, 4.05e-11 ]     # extrapolated
        - [2048, 64, 6.29e-1, 7.97e-11, 0, 7.74e-11 ]     # extrapolated
        - [2048, 128,1.20e+0, 1.53e-10, 0, 1.48e-10 ]     # extrapolated

        - [4096, 16, 2.64e-1, 3.12e-11, 0, 3.39e-11 ]     # extrapolated
        - [4096, 32, 2.79e-1, 5.91e-11, 0, 6.25e-11 ]     # extrapolated
        - [4096, 64, 1.01e+0, 1.21e-10, 0, 1.19e-10 ]     # extrapolated
        - [4096, 128,1.91e+0, 2.32e-10, 0, 2.27e-10 ]     # extrapolated

        - [8192, 16, 4.23e-1, 4.74e-11, 0, 5.21e-11 ]     # extrapolated
        - [8192, 32, 4.68e-1, 9.10e-11, 0, 9.66e-11 ]     # extrapolated
        - [8192, 64, 1.61e+0, 1.84e-10, 0, 1.84e-10 ]     # extrapolated
        - [8192, 128,3.06e+0, 3.54e-10, 0, 3.50e-10 ]     # extrapolated

    # LinkBitLine energy in the form [ Length (mm) Leakage Dynamic ] 
    # Energy(J) for a single bitline. Total flit energy will 
    # be obtained  as flit_size x reported Energy.
    LinkBitLine:
    #   - [ Length (mm), Leakage, Dynamic ] 
        - [0.5, 4.76e-7, 2.50e-14]
        - [1.0, 4.80e-7, 4.88e-14]
        - [1.5, 4.92e-7, 7.25e-14]
        - [2.0, 5.10e-7, 9.63e-14]
        - [2.5, 5.50e-7, 1.20e-13]
        - [3.0, 5.53e-7, 1.43e-13]

    Router:
        # [Static, Dynamic]
        crossbar:
        #   - [I/O Port number, FlitSize, Leakage, Dynamic]
            - [5, 16, 3.78e-4, 1.20e-13]
            - [5, 32, 7.49e-4, 2.21e-13]
            - [5, 64, 1.49e-3, 4.00e-13]
            - [5, 128, 2.75e-3, 8.0e-13] #interpolated

        network_interface:
        #   - [FlitSize, Static, Dynamic]
	# Not yet characterized (TBD)
            - [16, 0.0, 0.0]
            - [32, 0.0, 0.0]
            - [64, 0.0, 0.0]
            - [128, 0.0, 0.0]
            #- [16, 4.43e-4, 2.50e-13]
            #- [32, 8.64e-4, 4.22e-13]
            #- [64, 1.72e-3, 8.35e-13]

        routing:
        #   Algorithm:   [Static, Dynamic]
            default:     [1.20e-4, 6.00e-14]
            XY:          [1.20e-4, 6.00e-14]
            DYAD:        [1.35e-4, 6.75e-14]
            NEGATIVE_FIRST: [1.28e-4, 6.30e-14]
            NORTH_LAST:  [1.28e-4, 6.30e-14]
            DELTA:  	 [1.28e-4, 6.30e-14]
            WEST_FIRST:  [1.28e-4, 6.30e-14]
            ODD_EVEN:    [1.32e-4, 6.60e-14]
            TABLE_BASED: [2.40e-4, 12.00e-14]
            DISTANCE_AWARE:     [1.35e-4, 6.75e-14]
            DISTANCE_CONGESTION_AWARE: [1.35e-4, 6.75e-14]


        selection:
        #   Strategy:    [Static, Dynamic]
            default:     [1.10e-4, 5.00e-14]
            XY:          [1.10e-4, 5.00e-14]
            DYAD:        [1.23e-4, 5.89e-14]

    Hub:
        # [RX, TX] Contribution (W)
        # Set to 0 to isolate dynamic energy as per instruction "E_TX = 39mW/20Gbps = 1.95pJ/bit" implies per-bit model
        transceiver_leakage: [0.0, 0.0]

        # [RX, TX] Contribution (W)
        transceiver_biasing: [0.0, 0.0]

        # RX Dynamic Contribution in J/bit (RX Digital Interfaces)
        # 1.95 pJ/bit
        rx_dynamic: 1.95e-12

        # in W
        rx_snooping: 1.0e-15

        # TX Dynamic Contribution in W (To be divided for Datarate)
        # 39 mW = 0.039 W
        default_tx_energy: 0.039

        tx_attenuation_map:
        #   - [TX Hub ID, RX Hub ID, Attenuation]
            - [0, 1, 1.1]
            - [0, 2, 2.2]
            - [0, 3, 3.3]
            - [1, 0, 1.0]
            - [1, 2, 2.2]
            - [1, 3, 3.3]
            - [2, 0, 1.0]
            - [2, 1, 1.1]
            - [2, 3, 3.3]
            - [3, 0, 1.0]
            - [3, 1, 1.1]
            - [3, 2, 2.2]
