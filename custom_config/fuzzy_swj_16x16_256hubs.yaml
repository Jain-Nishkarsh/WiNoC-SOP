RadioChannels:
    defaults:
        data_rate: 16
        ber: [0, 0]
        mac_policy: [FUZZY_SWJ]
        fuzzy_token:
            preamble_cycles: 1
            thr1: 0.3
            thr2: 0.7
            thr_is_percentage: true

            initial_FA: 16
            FA_increment: 1
            FA_decrement_factor: 0.5
            
            pi_type: gaussian
            
            min_transmission_prob: 0.2
            initial_token_holder: 0
            token_order: static

clock_period_ps: 1000
reset_time: 100
simulation_time: 10000
stats_warm_up_time: 1000

min_packet_size: 3
max_packet_size: 3
packet_injection_rate: 0.005
probability_of_retransmission: 0.01
traffic_distribution: TRAFFIC_TABLE_BASED
traffic_table_filename: "traffic_tables/memory_corners_16x16.txt"

use_winoc: true
use_wirxsleep: false

detailed: false
verbose_mode: VERBOSE_LOW
trace_mode: false
trace_filename: ""
max_volume_to_be_drained: 0
show_buffer_stats: false

# CSV Logging
csv_log_enabled: true
csv_routing_log_filename: ""
csv_mac_log_filename: "fuzzy_test_swj_16x16.csv"
