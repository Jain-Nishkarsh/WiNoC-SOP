# FUZZY TOKEN JUMP PLUS - 8x8 Mesh with ALL enhancements
# Phase 1: Ready bitmap piggybacking
# Phase 2: Ready-count trigger (proactive mode switching)
# Phase 3: Ready-aware jump (smart token movement)

topology: MESH
mesh_dim_x: 8
mesh_dim_y: 8
buffer_depth: 32
flit_size: 16
r2h_link_length: 2.0
r2r_link_length: 1.0
n_virtual_channels: 1

routing_algorithm: XY
routing_table_filename: ""
dyad_threshold: 0.6
# da_threshold: 5
selection_strategy: NOP

Hubs:
    defaults:
        rx_radio_channels: [0]
        tx_radio_channels: [0]
        attached_nodes: []
        to_tile_buffer_size: 32
        from_tile_buffer_size: 32
        rx_buffer_size: 64
        tx_buffer_size: 64

    0: { attached_nodes: [0,1,8,9] }
    1: { attached_nodes: [2,3,10,11] }
    2: { attached_nodes: [4,5,12,13] }
    3: { attached_nodes: [6,7,14,15] }
    4: { attached_nodes: [16,17,24,25] }
    5: { attached_nodes: [18,19,26,27] }
    6: { attached_nodes: [20,21,28,29] }
    7: { attached_nodes: [22,23,30,31] }
    8: { attached_nodes: [32,33,40,41] }
    9: { attached_nodes: [34,35,42,43] }
    10: { attached_nodes: [36,37,44,45] }
    11: { attached_nodes: [38,39,46,47] }
    12: { attached_nodes: [48,49,56,57] }
    13: { attached_nodes: [50,51,58,59] }
    14: { attached_nodes: [52,53,60,61] }
    15: { attached_nodes: [54,55,62,63] }

RadioChannels:
    defaults:
        data_rate: 20
        ber: [0, 0]
        mac_policy: [FUZZY_RAJ]
        fuzzy_token:
            preamble_cycles: 2

            initial_FA: 8
            FA_increment: 1
            FA_decrement_factor: 0.4
            
            pi_type: gaussian
            
            min_transmission_prob: 0.05
            initial_token_holder: 0
            token_order: static
            
            # Ready-count trigger parameters (Phase 2)
            ready_history_window: 4           # W: sliding window size for ready count history
            fuzzy_ready_threshold: 4          # K: max ready hubs for FUZZY (≤3 ready)
            focused_ready_threshold: 5        # M: min ready hubs for FOCUSED (>8 ready)
            fuzzy_consecutive_windows: 4      # Consecutive windows ≤K to trigger FUZZY
            focused_consecutive_windows: 1    # Consecutive windows >M to trigger FOCUSED
            
            # Ready-aware jump parameters (Phase 3)
            jump_cooldown: 10             # Minimum token cycles between jumps (0 = no cooldown)

clock_period_ps: 1000
reset_time: 100
simulation_time: 5000  
stats_warm_up_time: 0

min_packet_size: 2
max_packet_size: 4
packet_injection_rate: 0.005
probability_of_retransmission: 0.01
traffic_distribution: TRAFFIC_RANDOM
traffic_table_filename: ""

use_winoc: true
use_wirxsleep: false

detailed: false
verbose_mode: VERBOSE_HIGH
trace_mode: false
trace_filename: ""
max_volume_to_be_drained: 0
show_buffer_stats: false
