RadioChannels:
    defaults:
        data_rate: 16
        ber: [0, 0]
        mac_policy: [FUZZY_TOKEN]
        
        fuzzy_token:
            initial_FA: 64       # Test 1: Start with all hubs
            FA_increment: 1
            FA_decrement_factor: 0.5
            min_transmission_prob: 0.0
            silence_cycles: 50
            thr1: 0.10
            thr2: 0.90
            thr_is_percentage: true
            pi_type: "equal"
            token_order: "static"
            initial_token_holder: 0
            collision_detect_cycles: 2
            preamble_cycles: 1

clock_period_ps: 1000
reset_time: 100
simulation_time: 5000      # SHORT: Only 5000 cycles for quick test
stats_warm_up_time: 1000   # SHORT: Only 1000 warmup

min_packet_size: 2
max_packet_size: 4
packet_injection_rate: 0.015  # Same as 16-hub test
probability_of_retransmission: 0.01
traffic_distribution: TRAFFIC_RANDOM
traffic_table_filename: ""

use_winoc: true
use_wirxsleep: false
detailed: false
verbose_mode: VERBOSE_OFF
trace_mode: false
trace_filename: ""
max_volume_to_be_drained: 0
show_buffer_stats: false
