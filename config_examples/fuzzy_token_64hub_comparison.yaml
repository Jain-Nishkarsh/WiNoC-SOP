# Quick Test Configuration for FUZZY_TOKEN
# Small simulation for fast testing

topology: MESH
mesh_dim_x: 8
mesh_dim_y: 8
buffer_depth: 64
flit_size: 32
r2h_link_length: 2.0
r2r_link_length: 1.0
n_virtual_channels: 1

routing_algorithm: DISTANCE_AWARE
routing_table_filename: ""
da_threshold: 5
dyad_threshold: 0.6
selection_strategy: RANDOM

# 64 hubs (one per core) - same as full config
Hubs:
    defaults:
        rx_radio_channels: [0]
        tx_radio_channels: [0]
        attached_nodes: []
        to_tile_buffer_size: 32
        from_tile_buffer_size: 32
        rx_buffer_size: 64
        tx_buffer_size: 64

