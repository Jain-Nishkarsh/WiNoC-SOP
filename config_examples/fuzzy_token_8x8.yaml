# Fuzzy Token MAC Protocol - 8x8 Mesh Test Configuration
# 8x8 mesh with 16 hubs (each covering 2x2 cluster)
# This creates more inter-cluster traffic to test wireless MAC
#
# NOC & Wpacket_injection_rate: 0.02RED CONFIGURATION
#
topology: MESH
mesh_dim_x: 8
mesh_dim_y: 8
buffer_depth: 32
flit_size: 32
r2h_link_length: 2.0
r2r_link_length: 1.0
n_virtual_channels: 1

routing_algorithm: DISTANCE_AWARE
routing_table_filename: ""
dyad_threshold: 0.6
# Distance threshold for DISTANCE_AWARE routing (Manhattan distance)
# Packets with distance > threshold will prefer wireless shortcuts
# Setting to 0 means ALL packets will try wireless from hub-connected nodes
da_threshold: 5
selection_strategy: NOP

#
# WIRELESS CONFIGURATION WITH FUZZY TOKEN
#
Hubs:
    defaults:
        rx_radio_channels: [0]
        tx_radio_channels: [0]
        attached_nodes: []
        to_tile_buffer_size: 32
        from_tile_buffer_size: 32
        rx_buffer_size: 64
        tx_buffer_size: 64

    # Hub 0: covers tiles (0,0), (0,1), (1,0), (1,1) - nodes 0,1,8,9
    0:
        attached_nodes: [0,1,8,9]

    # Hub 1: covers tiles (0,2), (0,3), (1,2), (1,3) - nodes 2,3,10,11
    1:
        attached_nodes: [2,3,10,11]

    # Hub 2: covers tiles (0,4), (0,5), (1,4), (1,5) - nodes 4,5,12,13
    2:
        attached_nodes: [4,5,12,13]

    # Hub 3: covers tiles (0,6), (0,7), (1,6), (1,7) - nodes 6,7,14,15
    3:
        attached_nodes: [6,7,14,15]

    # Hub 4: covers tiles (2,0), (2,1), (3,0), (3,1) - nodes 16,17,24,25
    4:
        attached_nodes: [16,17,24,25]

    # Hub 5: covers tiles (2,2), (2,3), (3,2), (3,3) - nodes 18,19,26,27
    5:
        attached_nodes: [18,19,26,27]

    # Hub 6: covers tiles (2,4), (2,5), (3,4), (3,5) - nodes 20,21,28,29
    6:
        attached_nodes: [20,21,28,29]

    # Hub 7: covers tiles (2,6), (2,7), (3,6), (3,7) - nodes 22,23,30,31
    7:
        attached_nodes: [22,23,30,31]

    # Hub 8: covers tiles (4,0), (4,1), (5,0), (5,1) - nodes 32,33,40,41
    8:
        attached_nodes: [32,33,40,41]

    # Hub 9: covers tiles (4,2), (4,3), (5,2), (5,3) - nodes 34,35,42,43
    9:
        attached_nodes: [34,35,42,43]

    # Hub 10: covers tiles (4,4), (4,5), (5,4), (5,5) - nodes 36,37,44,45
    10:
        attached_nodes: [36,37,44,45]

    # Hub 11: covers tiles (4,6), (4,7), (5,6), (5,7) - nodes 38,39,46,47
    11:
        attached_nodes: [38,39,46,47]

    # Hub 12: covers tiles (6,0), (6,1), (7,0), (7,1) - nodes 48,49,56,57
    12:
        attached_nodes: [48,49,56,57]

    # Hub 13: covers tiles (6,2), (6,3), (7,2), (7,3) - nodes 50,51,58,59
    13:
        attached_nodes: [50,51,58,59]

    # Hub 14: covers tiles (6,4), (6,5), (7,4), (7,5) - nodes 52,53,60,61
    14:
        attached_nodes: [52,53,60,61]

    # Hub 15: covers tiles (6,6), (6,7), (7,6), (7,7) - nodes 54,55,62,63
    15:
        attached_nodes: [54,55,62,63]

# Transmission channels configuration with Fuzzy Token MAC
RadioChannels:
    defaults:
        data_rate: 16
        ber: [0, 0]
        # Use Fuzzy Token MAC protocol
        mac_policy: [FUZZY_TOKEN]
        
        # Fuzzy Token specific configuration
        fuzzy_token:
            # Preamble phase duration in cycles
            preamble_cycles: 1
            
            # Collision detection duration in cycles
            collision_detect_cycles: 2
            
            # Silence (no activity) duration in cycles
            # Moderate value for 4:1 architecture
            silence_cycles: 15
            
            # Lower threshold for switching from fuzzy to focused mode
            # (as fraction of total nodes N when thr_is_percentage=true)
            thr1: 0.2
            
            # Upper threshold for switching from focused to fuzzy mode
            # Cap FA at 50% of nodes for 4:1 architecture (8 hubs max)
            thr2: 0.5
            
            # Interpret thresholds as percentages of N
            thr_is_percentage: true
            
            # Initial fuzzy area size (number of nodes)
            # Start at N/2.67 (~6) for optimal balance with 4:1 mapping
            initial_FA: 6
            
            # Additive increase on silence (AIMD)
            FA_increment: 1
            
            # Multiplicative decrease factor on collision (AIMD)
            # More aggressive decrease for low injection rate
            FA_decrement_factor: 0.4
            
            # Probability distribution type: "equal" or "gaussian"
            pi_type: equal
            
            # Minimum transmission probability for nodes with data (Option 1 fix)
            # Optimized for 4:1 architecture with small packets
            min_transmission_prob: 0
            
            # Initial token holder node ID
            initial_token_holder: 0
            
            # Token ring order: "static" or "pseudo_random"
            token_order: static

# SIMULATION PARAMETERS
clock_period_ps: 1000
reset_time: 100
simulation_time: 5000
stats_warm_up_time: 10

# Traffic configuration
# TRANSPOSE1 traffic: node (x,y) sends to ((mesh_dim_x-1-x), (mesh_dim_y-1-y))
# This forces long-distance communication across the mesh
min_packet_size: 2
max_packet_size: 4
packet_injection_rate: 0.015
probability_of_retransmission: 0.01
traffic_distribution: TRAFFIC_RANDOM
traffic_table_filename: ""

# Wireless NoC
use_winoc: true
use_wirxsleep: false

# Misc
detailed: false
verbose_mode: VERBOSE_LOW
trace_mode: false
trace_filename: ""
max_volume_to_be_drained: 0
show_buffer_stats: false
