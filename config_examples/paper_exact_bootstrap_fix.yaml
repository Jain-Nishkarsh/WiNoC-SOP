RadioChannels:
    defaults:
        data_rate: 20  # Paper Table I: 20 Gb/s
        ber: [0, 0]
        mac_policy: [FUZZY_TOKEN]
        
        fuzzy_token:
            # Optimized for faster convergence and better performance
            # Start with smaller FA to avoid low probability trap
            initial_FA: 16
            
            # AIMD parameters - more aggressive decrease
            FA_increment: 1
            FA_decrement_factor: 0.4
            
            # Minimum probability boost to ensure transmission opportunity
            min_transmission_prob: 0.15
            
            # Reduced silence timeout for faster adaptation
            silence_cycles: 20
            
            # Lower threshold to cap FA size earlier
            thr1: 0.10
            thr2: 0.60
            thr_is_percentage: true
            
            # Equal probability distribution
            pi_type: "equal"
            
            # Static token ring order
            token_order: "static"
            initial_token_holder: 0
            
            # Preamble and collision detection timing
            collision_detect_cycles: 2
            preamble_cycles: 1

clock_period_ps: 1000
reset_time: 1000
simulation_time: 10000  # Reduced for faster testing
stats_warm_up_time: 1000  # Reduced warmup

# Paper Table I: 80-bit packets
# With 32-bit flits: 80 bits ≈ 2.5 flits, use 2-3 flits (64-96 bits avg ~80)
min_packet_size: 2  # 64 bits (2 flits)
max_packet_size: 3  # 96 bits (3 flits) - avg 80 bits
packet_injection_rate: 0.08
probability_of_retransmission: 0.01
traffic_distribution: random
traffic_table_filename: ""

use_winoc: true
use_wirxsleep: false
detailed: false
verbose_mode: VERBOSE_LOW
trace_mode: false
trace_filename: ""
max_volume_to_be_drained: 0
show_buffer_stats: false
