# Paper Exact Architecture with Bootstrap Fix
# Based on DATE 2021 Fuzzy Token Paper (Table I)
# Architecture: 64 cores, 64 hubs (1:1), 80-bit packets, 20-bit preamble
# FIX: initial_FA=8 instead of 64 to enable bootstrap (p=1/8=12.5% vs 1/64=1.56%)

topology: MESH
mesh_dim_x: 8
mesh_dim_y: 8
buffer_depth: 64
flit_size: 32
r2h_link_length: 2.0
r2r_link_length: 1.0
n_virtual_channels: 1

routing_algorithm: DISTANCE_AWARE
routing_table_filename: ""
da_threshold: 5
dyad_threshold: 0.6
selection_strategy: RANDOM

# Paper Architecture: 64 hubs (one per core)
Hubs:
    defaults:
        rx_radio_channels: [0]
        tx_radio_channels: [0]
        attached_nodes: []
        to_tile_buffer_size: 32
        from_tile_buffer_size: 32
        rx_buffer_size: 64
        tx_buffer_size: 64

    # Row 0 (y=0)
